<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X 回复助手</title>
  <style>
    body {
      margin: 0;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      padding: 14px;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; color: #8b98a5; margin: 0 0 12px; line-height: 1.45; }
    button {
      width: 100%;
      appearance: none;
      border: none;
      cursor: pointer;
      background: #1d9bf0;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      border-radius: 999px;
      padding: 10px;
      margin-bottom: 8px;
    }
    button.secondary {
      background: transparent;
      color: #1d9bf0;
      border: 1px solid #1d9bf0;
    }
    .status { font-size: 12px; color: #8b98a5; margin-bottom: 10px; }
    .status.ok { color: #00ba7c; }
    .status.err { color: #f4212e; }
    .section-title { font-size: 13px; font-weight: 700; margin: 8px 0 6px; }
    .note { font-size: 11px; color: #71767b; margin: 0 0 8px; line-height: 1.4; }
    .item {
      border: 1px solid #2f3336;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 8px;
      background: #16181c;
    }
    .item .meta { font-size: 11px; color: #8b98a5; margin-bottom: 4px; }
    .item .preview { font-size: 12px; line-height: 1.4; margin-bottom: 6px; word-break: break-word; }
    .item a { color: #1d9bf0; font-size: 12px; text-decoration: none; margin-right: 10px; }
    .item button.linkish {
      width: auto;
      display: inline;
      background: transparent;
      color: #8b98a5;
      border: 1px solid #536471;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      margin: 0 4px 0 0;
    }
    #inboxEmpty { font-size: 12px; color: #8b98a5; }
  </style>
</head>
<body>
  <h1>X 回复助手</h1>
  <p>生成 3 条草稿，或点「多角度」出 5 条可选角度。仅复制/填入，不代发。</p>
  <button type="button" id="openOptions">打开设置（API Key）</button>
  <div class="status" id="status">检查配置中…</div>
  <div class="section-title">今日待回</div>
  <p class="note">尽力从通知/提及页抓取；可能漏检。打开对应帖后自己回复，或点「已回 / 忽略」。</p>
  <div id="inboxList"></div>
  <div id="inboxEmpty">加载中…</div>
  <script src="popup.js"></script>
</body>
</html>
